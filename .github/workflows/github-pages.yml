name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Point every page at the single global css/site.css (by folder depth)
      - name: Link pages to global site.css
        run: |
          set -euo pipefail
          # depth 1: Folder/page.html
          find . -mindepth 2 -maxdepth 2 -name '*.html' -print0 \
            | xargs -0 -r sed -i -E 's|href="(\.\./)*css/site\.css"|href="../css/site.css"|g'
          # depth 2: A/B/page.html
          find . -mindepth 3 -maxdepth 3 -name '*.html' -print0 \
            | xargs -0 -r sed -i -E 's|href="(\.\./)*css/site\.css"|href="../../css/site.css"|g'
          # depth 3: A/B/C/page.html (e.g. qna)
          find . -mindepth 4 -maxdepth 4 -name '*.html' -print0 \
            | xargs -0 -r sed -i -E 's|href="(\.\./)*css/site\.css"|href="../../../css/site.css"|g'
          echo "CSS links normalized:"
          grep -R --include='*.html' -n 'stylesheet' . | head -40

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
