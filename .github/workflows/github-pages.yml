name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link pages to global site.css
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          pat = re.compile(r'href=(["\'])(?:\.\./)*css/site\.css\1')
          fixed = 0
          for html in root.rglob("*.html"):
              rel = html.relative_to(root)
              depth = len(rel.parts) - 1
              href = "css/site.css" if depth <= 0 else ("../" * depth) + "css/site.css"
              text = html.read_text(encoding="utf-8")
              new_text, n = pat.subn(f'href="{href}"', text)
              if n:
                  html.write_text(new_text, encoding="utf-8")
                  fixed += n
                  print(f"{rel} -> {href}")
          print(f"Total replacements: {fixed}")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
