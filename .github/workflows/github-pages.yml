name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Point every page at the single global css/site.css (path depends on depth)
      - name: Link pages to global site.css
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import re

          root = Path(".")
          for html in root.rglob("*.html"):
              if html.name.startswith("."):
                  continue
              try:
                  rel = html.relative_to(root)
              except ValueError:
                  continue
              # number of parent dirs under repo root
              depth = len(rel.parts) - 1
              if depth <= 0:
                  href = "css/site.css"
              else:
                  href = "../" * depth + "css/site.css"
              text = html.read_text(encoding="utf-8")
              new_text, n = re.subn(
                  r'href=["\'](?:\.\./)*css/site\.css["\']',
                  f'href="{href}"',
                  text,
              )
              if n:
                  html.write_text(new_text, encoding="utf-8")
                  print(f"{rel}: -> {href} ({n})")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
